name: Android

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 需要补建的已发布版本标签
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: android-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  version:
    if: (github.event_name == 'push' && !github.event.deleted) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: 校验 SemVer 标签
        shell: bash
        run: |
          export LC_ALL=C
          number='(0|[1-9][0-9]*)'
          pre_id="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          build_id='[0-9A-Za-z-]+'
          pattern="^v$number\.$number\.$number(-$pre_id(\.$pre_id)*)?(\+$build_id(\.$build_id)*)?$"
          if ! [[ "$RELEASE_TAG" =~ $pattern ]]; then
            echo '::error::标签须为 v 开头的 SemVer 版本号，例如 v1.0.0 或 v1.0.0-rc.1。'
            exit 1
          fi
      - name: 确认待补建的 Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -Fx false

  android:
    needs: version
    runs-on: ubuntu-24.04
    # GitHub 仅向具有推送权限的调用者列出 Release 草稿。
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - name: 读取本次工作流的组件下载脚本
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: |
            .github/scripts
            tools
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: 安装 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: 下载 arm64 构建输入
        env:
          COMPONENTS_URL: ${{ vars.SOLBRAID_COMPONENTS_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node .ci-tools/.github/scripts/fetch-components.cjs
          else
            node .github/scripts/fetch-components.cjs
          fi
      - name: 构建并校验 arm64 Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SOLBRAID_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_PROPERTIES: ${{ secrets.SOLBRAID_RELEASE_SIGNING_PROPERTIES }}
        run: |
          : "${KEYSTORE_BASE64:?缺少 SOLBRAID_RELEASE_KEYSTORE_BASE64}"
          : "${SIGNING_PROPERTIES:?缺少 SOLBRAID_RELEASE_SIGNING_PROPERTIES}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/solbraid-signing.XXXXXX")
          trap 'rm -f -- "$signing_dir/release.keystore" "$signing_dir/release.properties"; rmdir -- "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.keystore"
          printf '%s\nstoreFile=%s\n' "$SIGNING_PROPERTIES" "$signing_dir/release.keystore" > "$signing_dir/release.properties"
          unset KEYSTORE_BASE64 SIGNING_PROPERTIES
          export SOLBRAID_RELEASE_SIGNING_PROPERTIES="$signing_dir/release.properties"
          bash gradlew :app:assembleRelease -PsolbraidAbis=arm64-v8a --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' --stacktrace --console=plain
          apk=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/solbraid-badging"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/solbraid-badging"; then exit 1; fi
          mkdir -p dist
          filename="Solbraid-${RELEASE_TAG}-arm64-v8a.apk"
          mv "$apk" "dist/$filename"
          cd dist
          sha256sum "$filename" > "$filename.sha256"
      - name: 保存 arm64 APK 和 SHA-256
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Solbraid-${{ env.RELEASE_TAG }}-arm64-v8a
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [version, android]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 取回已校验的安装包
        if: needs.android.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Solbraid-${{ env.RELEASE_TAG }}-arm64-v8a
          path: dist
      - name: 发布对应标签的 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RESULT: ${{ needs.android.result }}
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          options=()
          if [[ "${tag%%+*}" == *-* ]]; then options+=(--prerelease); fi
          files=()
          if [[ "$BUILD_RESULT" == success ]]; then
            cd dist
            apk="Solbraid-${tag}-arm64-v8a.apk"
            sha256sum --check "$apk.sha256"
            files=("$apk" "$apk.sha256")
          fi

          if ! metadata=$(gh release view "$tag" --json isDraft,assets); then
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes "${options[@]}" "${files[@]}"
            exit 0
          fi

          if (( ${#files[@]} )); then
            for file in "${files[@]}"; do
              digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
              if ! jq -e --arg name "$file" --arg hash "$digest" 'any(.assets[]; .name == $name and .state == "uploaded" and .digest == $hash)' <<< "$metadata" >/dev/null; then
                gh release upload "$tag" "$file" --clobber
              fi
            done
          fi
          if jq -e '.isDraft' <<< "$metadata" >/dev/null; then
            gh release edit "$tag" --draft=false "${options[@]}"
          fi
