name: Solbraid Community Registry AI Security Review

on:
  pull_request:
    paths:
      - "registry/submissions/**"
      - "registry/items/**"
      - "registry/registry.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-security-audit:
    name: Mandatory AI Security Gatekeeper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Fail-Closed Static + AI Security Audit
        id: audit
        continue-on-error: true
        env:
          SOLBRAID_REVIEWER_API_URL: ${{ secrets.SOLBRAID_REVIEWER_API_URL }}
          SOLBRAID_REVIEWER_API_KEY: ${{ secrets.SOLBRAID_REVIEWER_API_KEY }}
          SOLBRAID_REVIEWER_MODEL: ${{ vars.SOLBRAID_REVIEWER_MODEL || 'gpt-4o-mini' }}
          SOLBRAID_REVIEWER_WIRE: ${{ vars.SOLBRAID_REVIEWER_WIRE || 'openai' }}
          SOLBRAID_REQUIRE_LLM: ${{ vars.SOLBRAID_REQUIRE_LLM || '0' }}
        run: |
          node registry/ci-audit.mjs > audit-report.md 2>&1
          status=$?
          cat audit-report.md
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Post AI Security Audit Report on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.existsSync("audit-report.md")
              ? fs.readFileSync("audit-report.md", "utf8").slice(0, 60000)
              : "未能生成审查报告输出。";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce Gate Result
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
