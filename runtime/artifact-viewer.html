<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=4,user-scalable=yes" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; frame-src blob: data:;" />
<title>Solbraid Artifact Studio</title>
<style>
:root {
  --bg: #ffffff; --surface: #f7f8fa; --ink: #14171f; --muted: #5d6472;
  --border: #dfe3eb; --accent: #2563eb; --accent-soft: #eff6ff; --code-bg: #f1f4f9;
  --paper: #ffffff; --shadow: 0 2px 12px rgba(15, 23, 42, 0.08);
}
body.dark {
  --bg: #0f1117; --surface: #171a23; --ink: #eceff4; --muted: #98a2b3;
  --border: #2a3040; --accent: #60a5fa; --accent-soft: #172554; --code-bg: #1c202c;
  --paper: #141821; --shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; min-height: 100vh; }
body.inline, body.inline html { height: auto !important; min-height: 0 !important; background: transparent; overflow-x: hidden; }
#stage { width: 100%; min-height: 100vh; }
body.inline #stage { min-height: 0 !important; }
#stage.pad { padding: 16px; }
body.inline #stage.pad { padding: 8px 10px; }
iframe.sandbox-frame { width: 100%; height: 100vh; min-height: 100vh; border: 0; background: var(--bg); display: block; }
body.inline iframe.sandbox-frame { min-height: 240px; height: 280px; border-radius: 8px; }
.svg-wrap { width: 100%; min-height: 70vh; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
body.inline .svg-wrap { min-height: 0; padding: 8px; background: transparent; border: 0; border-radius: 0; }
.svg-wrap svg { max-width: 100%; height: auto; }
.math-inline-stage { overflow-x: auto; padding: 10px 6px; display: flex; align-items: center; justify-content: center; font-family: "Cambria Math", "STIX Two Math", "Times New Roman", "Noto Serif SC", serif; font-size: 17px; line-height: 1.5; color: var(--ink); }
.m-bigop { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; margin: 0 3px; }
.m-bigop .m-lim-top { font-size: 0.65em; margin-bottom: -1px; }
.m-bigop .m-lim-bot { font-size: 0.65em; margin-top: -1px; }
.m-bigop .m-op { font-size: 1.45em; line-height: 1; }
.m-boxed { border: 1px solid currentColor; padding: 2px 5px; border-radius: 3px; display: inline-block; }
.m-cancel { text-decoration: line-through; }
.chart-card { width: 100%; background: var(--paper); border: 1px solid var(--border); border-radius: 12px; padding: 12px; position: relative; }
body.inline .chart-card { background: transparent; border: 0; padding: 4px 2px; border-radius: 0; }
.chart-title { font-size: 13.5px; font-weight: 600; color: var(--ink); margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; font-size: 11.5px; color: var(--muted); }
.chart-legend-item { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; padding: 2px 6px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); user-select: none; transition: opacity .15s; }
.chart-legend-item.off { opacity: 0.38; text-decoration: line-through; }
.chart-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.chart-tip-bar { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 12px; line-height: 1.4; }
.chart-tip-bar.active { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 500; }
.code-box { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.5; margin: 8px 0; }
.csv-table th.sortable { cursor: pointer; user-select: none; }
.csv-table th.sortable:hover { color: var(--accent); }
.tex-page { max-width: 780px; margin: 12px auto; padding: 30px 26px; background: var(--paper); color: var(--ink); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); font-family: "Times New Roman", "Noto Serif SC", Georgia, serif; line-height: 1.72; font-size: 16px; }
.tex-page h1.tex-title { font-size: 1.75em; text-align: center; margin: 0 0 8px; line-height: 1.3; }
.tex-page .tex-meta { text-align: center; color: var(--muted); font-size: 0.94em; margin-bottom: 18px; }
.tex-page .tex-abstract { background: var(--surface); border: 1px solid var(--border); padding: 12px 15px; margin: 14px 0 20px; border-radius: 10px; font-size: 0.94em; }
.tex-page h2 { font-size: 1.32em; margin: 22px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.tex-page h3 { font-size: 1.12em; margin: 16px 0 6px; }
.tex-page h4 { font-size: 1.02em; margin: 12px 0 4px; }
.tex-page p { margin: 0 0 10px; text-align: justify; }
.tex-page ul, .tex-page ol { margin: 6px 0 12px 22px; padding: 0; }
.tex-page li { margin: 4px 0; }
.tex-page table { border-collapse: collapse; margin: 14px auto; font-size: 0.93em; max-width: 100%; overflow-x: auto; display: block; }
.tex-page th, .tex-page td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
.tex-page tr.toprule td, .tex-page tr.toprule th { border-top: 2px solid var(--ink); }
.tex-page tr.bottomrule td { border-bottom: 2px solid var(--ink); }
.tex-thm { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; margin: 12px 0; }
.tex-thm-head { font-weight: 700; margin-right: 6px; }
.tex-proof { background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; padding: 10px 14px; margin: 10px 0; color: var(--ink); }
.tex-qed { float: right; font-weight: 700; }
.math-block { overflow-x: auto; padding: 10px 8px; margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 12px; }
.math-block .eq-num { margin-left: auto; color: var(--muted); font-size: 0.9em; }
.math-inline { font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; }
.m-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 2px; font-size: 0.92em; line-height: 1.1; }
.m-frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px 1px; }
.m-frac > span:last-child { padding: 1px 3px 0; }
.m-sqrt { display: inline-flex; align-items: baseline; }
.m-sqrt-bar { border-top: 1px solid currentColor; padding: 1px 3px 0; }
.m-mat { display: inline-table; vertical-align: middle; border-collapse: collapse; margin: 0 2px; }
.m-mat td { border: 0 !important; padding: 1px 6px !important; text-align: center !important; }
.m-delim { font-size: 1.35em; vertical-align: middle; font-weight: 300; }
.m-op { font-size: 1.15em; margin: 0 2px; }
.m-accent { display: inline-flex; flex-direction: column; align-items: center; line-height: 0.9; vertical-align: baseline; }
.m-accent > .m-top { font-size: 0.72em; margin-bottom: -2px; }
.m-var { font-style: italic; }
.m-bb { font-weight: 700; font-family: "Times New Roman", serif; }
.m-cal { font-family: cursive, Georgia, serif; font-style: italic; }
.m-tt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
.md-doc { max-width: 780px; margin: 0 auto; line-height: 1.7; font-size: 15px; color: var(--ink); }
.md-doc h1 { font-size: 1.45em; font-weight: 700; line-height: 1.32; letter-spacing: -0.015em; margin: 4px 0 14px; }
.md-doc h2 { font-size: 1.2em; font-weight: 650; line-height: 1.38; margin: 20px 0 10px; }
.md-doc h3 { font-size: 1.05em; font-weight: 600; line-height: 1.42; margin: 16px 0 8px; }
.md-doc h4, .md-doc h5, .md-doc h6 { font-size: 0.96em; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
.md-doc p { margin: 0 0 10px; }
.md-doc hr { border: 0; height: 1px; background: var(--border); margin: 16px 0; }
.md-doc a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.md-doc code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.87em; background: var(--code-bg); padding: 1.5px 5.5px; border-radius: 5px; border: 1px solid var(--border); }
.md-doc pre code { background: transparent; padding: 0; border: 0; border-radius: 0; font-size: 12.5px; }
.md-code-card { margin: 12px 0; border-radius: 11px; overflow: hidden; border: 1px solid var(--border); background: var(--code-bg); }
.md-code-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); }
.md-code-card pre { margin: 0; padding: 12px; border: 0; border-radius: 0; background: transparent; overflow-x: auto; line-height: 1.55; }
.md-doc pre { background: var(--code-bg); padding: 12px; border-radius: 10px; overflow-x: auto; border: 1px solid var(--border); margin: 12px 0; }
.csv-wrap { max-width: 960px; margin: 0 auto; }
.csv-table-box { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--paper); margin-top: 12px; }
.csv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.csv-table th, .csv-table td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; white-space: nowrap; }
.csv-table th { background: var(--surface); font-weight: 600; }
.err-banner { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 12px; margin: 12px; font-family: monospace; font-size: 12.5px; white-space: pre-wrap; }
body.dark .err-banner { background: #3b1318; color: #fca5a5; border-color: #7f1d1d; }
.md-table-wrap { overflow-x: auto; margin: 12px 0; border-radius: 11px; border: 1px solid var(--border); background: var(--paper); }
.md-doc table { border-collapse: collapse; width: 100%; margin: 0; font-size: 13.5px; }
.md-doc th, .md-doc td { border-bottom: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.md-doc tr:last-child td { border-bottom: 0; }
.md-doc tbody tr:nth-child(even) { background: rgba(128, 138, 158, 0.045); }
.md-doc th { background: var(--surface); font-weight: 600; color: var(--ink); }
.md-doc blockquote { margin: 12px 0; padding: 11px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; color: var(--muted); }
.md-doc blockquote p:last-child { margin-bottom: 0; }
.md-callout { margin: 12px 0; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
.md-callout-head { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; margin-bottom: 5px; }
.md-callout-head svg { width: 14px; height: 14px; flex-shrink: 0; }
.md-callout-body { font-size: 0.95em; color: var(--ink); line-height: 1.62; }
.md-callout-note { background: rgba(37, 99, 235, 0.07); border-color: rgba(37, 99, 235, 0.22); }
.md-callout-note .md-callout-head { color: #2563eb; }
body.dark .md-callout-note { background: rgba(96, 165, 250, 0.12); border-color: rgba(96, 165, 250, 0.28); }
body.dark .md-callout-note .md-callout-head { color: #60a5fa; }
.md-callout-tip { background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.24); }
.md-callout-tip .md-callout-head { color: #059669; }
body.dark .md-callout-tip { background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.28); }
body.dark .md-callout-tip .md-callout-head { color: #34d399; }
.md-callout-important { background: rgba(139, 92, 246, 0.08); border-color: rgba(139, 92, 246, 0.24); }
.md-callout-important .md-callout-head { color: #7c3aed; }
body.dark .md-callout-important { background: rgba(167, 139, 250, 0.12); border-color: rgba(167, 139, 250, 0.28); }
body.dark .md-callout-important .md-callout-head { color: #a78bfa; }
.md-callout-warning { background: rgba(245, 158, 11, 0.09); border-color: rgba(245, 158, 11, 0.26); }
.md-callout-warning .md-callout-head { color: #d97706; }
body.dark .md-callout-warning { background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.28); }
body.dark .md-callout-warning .md-callout-head { color: #fbbf24; }
.md-callout-caution { background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.24); }
.md-callout-caution .md-callout-head { color: #dc2626; }
body.dark .md-callout-caution { background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.28); }
body.dark .md-callout-caution .md-callout-head { color: #f87171; }
.md-doc ul, .md-doc ol { margin: 6px 0 12px 22px; padding: 0; }
.md-doc li { margin: 5px 0; }
.md-task-list { list-style: none; margin-left: 2px !important; }
.md-task-item { display: flex; align-items: flex-start; gap: 8px; }
.md-checkbox { width: 16px; height: 16px; margin-top: 4px; border-radius: 5px; border: 1.5px solid var(--border); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
.md-checkbox.checked { background: #10b981; border-color: #10b981; color: #fff; }
.md-task-done { color: var(--muted); text-decoration: line-through; }
#stage.vp-mobile { max-width: 390px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
#stage.vp-desktop { min-width: 900px; }
@media print {
  body, body.dark { background: #fff !important; color: #111 !important; --bg: #fff; --paper: #fff; --ink: #111; --muted: #444; --surface: #f5f5f5; --border: #ccc; }
  .tex-page { border: 0; box-shadow: none; margin: 0; padding: 10mm; max-width: none; }
}
</style>
</head>
<body>
<div id="stage"></div>
<script src="artifact-latex.js"></script>
<script src="artifact-mermaid.js"></script>
<script src="artifact-renderer.js"></script>
</body>
</html>
